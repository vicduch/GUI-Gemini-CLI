name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-2.91

      - name: Install Python tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-asyncio mypy ruff

      - name: Lint
        run: ruff check core

      - name: Type check
        run: mypy core

      - name: Test
        env:
          XDG_RUNTIME_DIR: /tmp/gui-terminal-runtime
          GSETTINGS_BACKEND: memory
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a pytest -q
