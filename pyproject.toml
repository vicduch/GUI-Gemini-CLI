[tool.mypy]
python_version = "3.12"
strict = true
files = ["core"]

[[tool.mypy.overrides]]
module = ["gi", "gi.repository", "gi.repository.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"main.py" = ["E402"]
"ui/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
